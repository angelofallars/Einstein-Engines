- type: entity
  id: OrganFelinidTongue
  parent: OrganHumanTongue
  name: cat tongue
  description: Cat got your tongue, or you got cat tongue?
  components:
  - type: Organ
    onAdd:
    - type: SpeechModifier
      speechSounds: Alto
      speechVerb: Felinid
    - type: VocalModifier
      wilhelm: "/Audio/Nyanotrasen/Voice/Felinid/cat_wilhelm.ogg"
      sounds:
        Male: MaleFelinid
        Female: FemaleFelinid
        Unsexed: MaleFelinid
    - type: TypingIndicatorModifier
      proto: felinid
    tagOnAdd:
    - FelinidEmotes

- type: entity
  id: OrganFelinidEars
  parent: OrganHumanEars
  name: cat ears
  description: "Holding these might potentially be contagious."
  components:
  - type: Sprite
    sprite: Clothing/Head/Hats/catears.rsi
    state: icon
  - type: MarkingContainer
    marking: FelinidEarsBasic

- type: entity
  id: OrganFelinidTail
  parent: BaseHumanOrgan
  name: cat tail
  description: "Should you really have this?"
  components:
  - type: Sprite
    sprite: Nyanotrasen/Mobs/Customization/felinid_tails.rsi
    state: basic_tail_tip
  - type: MarkingContainer
    marking: FelinidTailBasic
  - type: Tail
